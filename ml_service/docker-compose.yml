version: '3.8'

services:
  ml-service:
    build: ./ml-service
    ports:
      - "5001:5001"
    volumes:
      - ./ml-service/models:/app/models
      - ./ml-service/data:/app/data
    environment:
      - ENVIRONMENT=development
      - LOG_LEVEL=info
    networks:
      - hospital-network
    restart: unless-stopped

  backend:
    build: ./backend
    ports:
      - "5000:5000"
    depends_on:
      - ml-service
    environment:
      - ML_SERVICE_URL=http://ml-service:5001
    networks:
      - hospital-network

networks:
  hospital-network:
    driver: bridge